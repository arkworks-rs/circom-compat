[package]
name = "ark-circom"
version = "0.6.0"
edition = "2024"
description = "Arkworks bindings to Circom's R1CS, for Groth16 Proof and Witness generation in Rust"
homepage = "https://arkworks.rs"
repository = "https://github.com/arkworks-rs/circom-compat"
license = "MIT OR Apache-2.0"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

# WASM operations
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { version = "6.1.0-rc.3", default-features = false, features = ["default"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmer = { version = "6.1.0-rc.3", default-features = false, features = ["js-default"] }

[dependencies]
fnv = { version = "1.0.7", default-features = false }
num = { version = "0.4.3" }
num-traits = { version = "0.2.16", default-features = false }
num-bigint = { version = "0.4.3", default-features = false, features = [ "rand" ] }

# ZKP Generation
ark-crypto-primitives = { version = "0.6" }
ark-ff = { version = "0.6.0", default-features = false, features = [ "parallel", "asm" ] }
ark-ec = { version = "0.6.0", default-features = false, features = [ "parallel" ] }
ark-std = { version = "0.6.0", default-features = false, features = [ "parallel" ] }
ark-bn254 = { version = "0.6.0" }
ark-groth16 = { version = "0.6", default-features = false, features = [ "parallel" ] }
ark-poly = { version = "0.6.0", default-features = false, features = [ "parallel" ] }
ark-relations = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
rayon = { version = "1.5.0" }


# decoding of data
hex = "0.4.3"
byteorder = "1.4.3"

# ethereum compat
ethers-core = { version = "2.0.7", default-features = false, optional = true }

# error handling
thiserror = "2"
color-eyre = "0.6.2"

cfg-if = "1.0.0"

# Serializ & Deserialize
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.29.1", features = ["macros"] }
ethers = "2.0.7"
criterion = "0.7"

[dev-dependencies]
hex-literal = "1.0"
serde_json = "1.0.94"

[[bench]]
name = "groth16"
harness = false

[features]
default = ["ethereum"]
bench-complex-all = []
ethereum = ["ethers-core"]


[patch.crates-io]
ark-relations = { git = "https://github.com/arkworks-rs/snark.git" }
ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std.git" }
ark-groth16 = { git = "https://github.com/arkworks-rs/groth16.git" }
